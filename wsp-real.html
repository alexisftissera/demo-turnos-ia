<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp Real - Cómo se ve</title><style>
*{box-sizing:border-box;margin:0;font-family:Segoe UI,Helvetica,Arial}
body{background:#111;display:flex;justify-content:center;padding:16px;color:#111}
.phone{width:390px;max-width:100%;height:780px;background:#ECE5DD;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;border:8px solid #222}
.h{background:#075E54;color:#fff;padding:10px 12px;display:flex;gap:10px;align-items:center}
.h .av{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.h small{opacity:.8}.ver{color:#53e28a}
#chat{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:6px;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.08"><text y="50">💬</text></svg>')}
.b{max-width:80%;padding:8px 10px;border-radius:10px;font-size:14px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.2)}
.in{background:#fff;align-self:flex-start;border-top-left-radius:2px}
.out{background:#DCF8C6;align-self:flex-end;border-top-right-radius:2px}
.meta{font-size:10px;color:#667781;text-align:right;margin-top:2px}
.tick{color:#53bdeb}.day{align-self:center;background:#FDF3C6;font-size:11px;padding:5px 12px;border-radius:8px;color:#54656F}
.enc{background:#FFF3C4;border-left:4px solid #00A884;padding:8px;font-size:12px;margin:8px;border-radius:6px}
button{margin:10px;padding:12px;border-radius:10px;border:none;background:#00A884;color:#fff;font-weight:700;cursor:pointer}
</style></head><body>
<div class="phone">
<div class="h"><div class="av">💈</div><div><div>Barbería Centro Córdoba <span class="ver">✔</span></div><small>cuenta de empresa · en línea</small></div></div>
<div class="enc">🔒 Los mensajes están cifrados. Este chat lo atiende el <b>Asistente IA 24/7</b> + recepción Lun-Sáb 9-20h.</div>
<div id="chat"><div class="day">HOY 23:47 · fuera de hora</div></div>
<button id="play">▶ Ver cómo sería en WhatsApp real</button>
</div>
<script>
const chat=document.getElementById('chat');
function add(t,me,tick=true){const d=document.createElement('div');d.className='b '+(me?'out':'in');d.innerHTML=t+"<div class='meta'>23:"+ (47+chat.children.length) +" "+(me?"<span class='tick'>✔✔</span>":"")+"</div>";chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return new Promise(r=>setTimeout(r,900))}
document.getElementById('play').onclick=async e=>{e.target.remove();
await add('Hola, precio corte? 🕐',true);
await add('🌙 Son las 23:47, estoy de guardia: 💈 Corte $15.000 · Corte+barba $22.000 · Color $35.000<br>¿Te agendo? Decime tu nombre.',false);
await add('Soy Leo, quiero mañana tarde corte',true);
await add('Dale Leo 👍 Mañana tengo: 16:00 · 16:30 · 17:30. ¿Cuál te va?',false);
await add('16:30',true);
await add('✅ Listo <b>Leo: Corte mañana 16:30</b> · Colón 1200.<br>Te mando recordatorio 24h antes. ¿Confirmo?',false);
await add('Si dale',true);
await add('✅ <b>Turno confirmado.</b> Mañana te esperamos. Si fallás avisame y lo movemos 🙌',false);
await add('Esto en producción sale del número oficial via Meta Cloud API → n8n → Calendar. El dueño lo ve en su agenda sin atender.',false);
};
</script></body></html>
